name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  NODE_VERSION: 24.19.0

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node }}
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint and format check
        run: |
          pnpm check
          pnpm format:check

      - name: Run tests with coverage and JUnit results
        run: |
          echo "🧪 Running tests with coverage and JUnit results..."
          pnpm test:ci
          echo "📊 Test coverage completed"

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.node == env.NODE_VERSION }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml

      - name: Add coverage summary
        if: always() && !cancelled() && matrix.node == env.NODE_VERSION
        run: pnpm coverage:summary >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always() && !cancelled() && matrix.node == env.NODE_VERSION
        uses: actions/upload-artifact@v7
        with:
          name: test-coverage-node-${{ matrix.node }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 30

      - name: Build package
        run: pnpm build

      - name: Test package exports
        run: |
          node -e '
            const pkg = require("./package.json");
            const fs = require("fs");

            console.log("🔍 Verifying package exports...");

            // Check main exports exist
            const exports = pkg.exports;
            for (const [key, value] of Object.entries(exports)) {
              if (typeof value === "object" && value.import) {
                const importPath = value.import;
                if (importPath.startsWith("./dist/")) {
                  const filePath = importPath.replace("./", "");
                  if (!fs.existsSync(filePath)) {
                    throw new Error(`Export file not found: ${filePath}`);
                  }
                  console.log(`✅ ${key} -> ${importPath}`);
                }
              } else if (typeof value === "string") {
                if (value.startsWith("./") && !fs.existsSync(value.replace("./", ""))) {
                  throw new Error(`Export file not found: ${value}`);
                }
                console.log(`✅ ${key} -> ${value}`);
              }
            }

            console.log("🎉 All exports verified successfully!");
          '

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-node-${{ matrix.node }}
          path: dist/
          retention-days: 30

  security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node }}
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level moderate

      - name: Check for known vulnerabilities
        run: |
          echo "🔍 Checking for known vulnerabilities..."
          if pnpm audit --json | grep -q '"vulnerabilities"'; then
            echo "⚠️ Vulnerabilities found, please review:"
            pnpm audit
          else
            echo "✅ No known vulnerabilities found"
          fi
