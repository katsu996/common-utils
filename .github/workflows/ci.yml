name: CI

on:
  push:
    branches: main
  pull_request:
    branches: main
  workflow_call:

env:
  NODE_VERSION: 24.18.0
  PNPM_VERSION: 10.34.5

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["24.18.0", "22", "20"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint and format check
        run: |
          pnpm check
          pnpm format:check

      - name: Run tests with coverage
        run: |
          echo "🧪 Running tests with coverage..."
          pnpm test:coverage
          echo "📊 Test coverage completed"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 30

      - name: Build package
        run: pnpm build

      - name: Test package exports
        run: |
          node -e '
            const pkg = require("./package.json");
            const fs = require("fs");

            console.log("🔍 Verifying package exports...");

            // Check main exports exist
            const exports = pkg.exports;
            for (const [key, value] of Object.entries(exports)) {
              if (typeof value === "object" && value.import) {
                const importPath = value.import;
                if (importPath.startsWith("./dist/")) {
                  const filePath = importPath.replace("./", "");
                  if (!fs.existsSync(filePath)) {
                    throw new Error(`Export file not found: ${filePath}`);
                  }
                  console.log(`✅ ${key} -> ${importPath}`);
                }
              } else if (typeof value === "string") {
                if (value.startsWith("./") && !fs.existsSync(value.replace("./", ""))) {
                  throw new Error(`Export file not found: ${value}`);
                }
                console.log(`✅ ${key} -> ${value}`);
              }
            }

            console.log("🎉 All exports verified successfully!");
          '

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-node-${{ matrix.node-version }}
          path: dist/
          retention-days: 30

  security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["24.18.0", "22", "20"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level moderate

      - name: Check for known vulnerabilities
        run: |
          echo "🔍 Checking for known vulnerabilities..."
          if pnpm audit --json | grep -q '"vulnerabilities"'; then
            echo "⚠️ Vulnerabilities found, please review:"
            pnpm audit
          else
            echo "✅ No known vulnerabilities found"
          fi
