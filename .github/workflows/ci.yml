name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["22.16.0", "20.x", "18.x"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "^10.12.4"

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Lint and format check
        run: |
          pnpm run check
          pnpm run format:check

      - name: Build package
        run: pnpm run build

      - name: Test package exports
        run: |
          node -e '
            const pkg = require("./package.json");
            const fs = require("fs");

            console.log("🔍 Verifying package exports...");

            // Check main exports exist
            const exports = pkg.exports;
            for (const [key, value] of Object.entries(exports)) {
              if (typeof value === "object" && value.import) {
                const importPath = value.import;
                if (importPath.startsWith("./dist/")) {
                  const filePath = importPath.replace("./", "");
                  if (!fs.existsSync(filePath)) {
                    throw new Error(`Export file not found: ${filePath}`);
                  }
                  console.log(`✅ ${key} -> ${importPath}`);
                }
              } else if (typeof value === "string") {
                if (value.startsWith("./") && !fs.existsSync(value.replace("./", ""))) {
                  throw new Error(`Export file not found: ${value}`);
                }
                console.log(`✅ ${key} -> ${value}`);
              }
            }

            console.log("🎉 All exports verified successfully!");
          '

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "^10.12.4"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level moderate

      - name: Check for known vulnerabilities
        run: |
          echo "🔍 Checking for known vulnerabilities..."
          if pnpm audit --json | grep -q '"vulnerabilities"'; then
            echo "⚠️ Vulnerabilities found, please review:"
            pnpm audit
          else
            echo "✅ No known vulnerabilities found"
          fi